[project]
name = "otto-backend"
version = "0.1.0"
description = "Backend API for Otto"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "fastapi",
    "python-dotenv>=1.2.4",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
